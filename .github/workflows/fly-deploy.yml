name: Fly Deploy

# Auto-deploy to Fly.io whenever main updates (e.g. a PR is merged).
# Also runnable manually from the Actions tab via "Run workflow".
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never let two deploys run at once; cancel an in-progress one if a newer
# commit lands.
concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only builds the Docker image on Fly's builders, so the
      # runner doesn't need Docker. App name is read from fly.toml.
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
